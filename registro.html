<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo Cultural - Registro</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <h1 class="logo">Nodo Cultural</h1>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Volver al sitio</a></li>
        <li><a href="guia_uso.html">Ayuda</a></li>
      </ul>
    </nav>
  </header>

  <main class="admin-main">

    <section class="admin-intro">
      <h2>Creá tu cuenta</h2>
      <p>Registrate para confirmar tu asistencia a charlas y anotarte en talleres.</p>
    </section>

    <section class="admin-form-section">
      <h3>¡Registrate en Nodo Cultural!</h3>

      <form id="form-registro" class="admin-form">

        <div class="form-fila">
          <div class="form-grupo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" maxlength="60" placeholder="Tu nombre" required>
          </div>

          <div class="form-grupo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" maxlength="60" placeholder="Tu apellido" required>
          </div>
        </div>

        <div class="form-grupo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" maxlength="60" placeholder="Tu correo" required>
        </div>

        <div class="form-grupo">
          <label for="contrasenia">Contraseña</label>
          <input type="password" id="contrasenia" minlength="8" placeholder="Tu contraseña" required>
        </div>

        <div class="form-grupo">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" required>
        </div>

        <button type="submit" class="btn">
          <i class="fa-solid fa-user-plus"></i> Registrarse
        </button>

        <a href="login.html" class="btn btn-outline">Ya tengo cuenta</a>

      </form>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>2026 Nodo Cultural. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="scripts/storage.js"></script>
  <script src="scripts/registro.js"></script>
</body>

</html>
