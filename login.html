<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo Cultural - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <h1 class="logo">Nodo Cultural</h1>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Volver al sitio</a></li>
        <li><a href="guia_uso.html">Ayuda</a></li>
      </ul>
    </nav>
  </header>

  <main class="admin-main">

    <section class="admin-intro">
      <h2>Iniciá sesión</h2>
      <p>Ingresá con tu cuenta para confirmar tu asistencia a charlas y talleres.</p>
    </section>

    <section class="admin-form-section">
      <h3>¡Logeate en Nodo Cultural!</h3>

      <form id="form-login" class="admin-form">

        <div class="form-grupo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" maxlength="60" placeholder="Tu correo" required>
        </div>

        <div class="form-grupo">
          <label for="contrasenia">Contraseña</label>
          <input type="password" id="contrasenia" placeholder="Tu contraseña" required>
        </div>

        <button type="submit" class="btn">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>

        <a href="registro.html" class="btn btn-outline">Aún no tengo cuenta</a>

      </form>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>2026 Nodo Cultural. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="scripts/storage.js"></script>
  <script src="scripts/usuario.js"></script>
  <script src="scripts/login.js"></script>
</body>

</html>
